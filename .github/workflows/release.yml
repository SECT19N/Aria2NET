name: release

# Push a tag such as v0.3.0 or v1.0.0-rc.1 to build and publish a GitHub Release. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against Directory.Build.props
        id: check
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/check-release-tag.ps1 -Tag $env:TAG

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release

  package:
    needs: verify
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package ${{ matrix.rid }}
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./tools/package.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*.zip*
          if-no-files-found: error

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "Aria2NET ${TAG#v}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/* --repo "${{ github.repository }}" "${flags[@]}"
