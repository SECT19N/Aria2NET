name: release

# Run by hand from the Actions tab ("Run workflow") when master is ready to ship. See docs/RELEASING.md.
# Nothing is pushed until the build, the tests and both packages have succeeded.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.4.0 or 1.0.0-rc.1'
        required: true
        type: string
      dry_run:
        description: 'Build and package only (installer, portable zip and update packages are attached to this run); no commit, tag or release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only release from master
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/master' }}
        shell: pwsh
        run: throw "Run this workflow on master (it was started on ${{ github.ref_name }}). Use dry run to test another branch."

      - name: Validate version and set it in Directory.Build.props
        id: prepare
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./tools/prepare-release.ps1 -Version $env:VERSION

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release

  package:
    needs: verify
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Velopack builds delta packages against the previous release, so that one is downloaded first (missing on the first release: fine).
      - name: Package ${{ matrix.rid }}
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VPK_TOKEN: ${{ github.token }}
        run: ./tools/package.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION -DownloadPrevious

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/*
          if-no-files-found: error

  release:
    if: ${{ !inputs.dry_run }}
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # One folder per processor: artifacts/package-win-x64 and artifacts/package-win-arm64.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: package-*

      - name: Commit the version bump and tag it
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          ./tools/prepare-release.ps1 -Version $env:VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet Directory.Build.props
          if ($LASTEXITCODE -ne 0) {
              git add Directory.Build.props
              git commit -m "Release $env:TAG"
          }
          git tag $env:TAG
          # Atomic: either the branch and the tag both move, or neither does (e.g. master changed since this run started).
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Push failed. If master moved on, run the release again." }

      # vpk creates the release (published, pre-release when asked) and uploads the packages and the update feed of each processor.
      # --merge lets the second upload join the release the first one created.
      - name: Create GitHub Release and upload the packages
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          dotnet tool restore
          foreach ($rid in 'win-x64', 'win-arm64') {
              $vpkArgs = @('upload', 'github', '--repoUrl', "https://github.com/${{ github.repository }}", '--outputDir', "artifacts/package-$rid",
                        '--channel', $rid, '--tag', $env:TAG, '--releaseName', "Aria2NET $env:VERSION", '--publish', '--merge')
              if ($env:PRERELEASE -eq 'true') { $vpkArgs += '--pre' }
              dotnet vpk @vpkArgs
              if ($LASTEXITCODE -ne 0) { throw "vpk upload failed for $rid ($LASTEXITCODE)" }
          }

      # vpk writes no release notes of its own; use the ones GitHub generates from the commits and pull requests since the previous tag.
      - name: Add generated release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$env:TAG --jq .body
          if ($LASTEXITCODE -ne 0) { throw "Could not generate release notes" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release edit $env:TAG --repo "${{ github.repository }}" --notes-file release-notes.md