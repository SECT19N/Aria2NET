name: release

# Run by hand from the Actions tab ("Run workflow") when master is ready to ship. See docs/RELEASING.md.
# Nothing is pushed until the build, the tests and both packages have succeeded.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.4.0 or 1.0.0-rc.1'
        required: true
        type: string
      dry_run:
        description: 'Build and package only (zips are attached to this run); no commit, tag or release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only release from master
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/master' }}
        shell: pwsh
        run: throw "Run this workflow on master (it was started on ${{ github.ref_name }}). Use dry run to test another branch."

      - name: Validate version and set it in Directory.Build.props
        id: prepare
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./tools/prepare-release.ps1 -Version $env:VERSION

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release

  package:
    needs: verify
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package ${{ matrix.rid }}
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./tools/package.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*.zip*
          if-no-files-found: error

  release:
    if: ${{ !inputs.dry_run }}
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Commit the version bump and tag it
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          ./tools/prepare-release.ps1 -Version $env:VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet Directory.Build.props
          if ($LASTEXITCODE -ne 0) {
              git add Directory.Build.props
              git commit -m "Release $env:TAG"
          }
          git tag $env:TAG
          # Atomic: either the branch and the tag both move, or neither does (e.g. master changed since this run started).
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Push failed. If master moved on, run the release again." }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "Aria2NET $VERSION")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/* --repo "${{ github.repository }}" "${flags[@]}"
