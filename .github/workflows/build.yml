name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release
