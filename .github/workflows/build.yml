name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Dependabot PRs are not built automatically (they queued up ahead of real work); run this workflow by hand on its branch.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Publishing has its own failure modes (it once left out the compiled XAML), so make sure it keeps working on every change.
  package:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Package win-x64
        shell: pwsh
        run: ./tools/package.ps1 -Rid win-x64 -Version 0.0.0-ci
