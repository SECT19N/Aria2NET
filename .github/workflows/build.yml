name: build

# Build + test runs on every pull request. The packaging check is manual: "Run workflow" on any branch.
# No path filter on purpose: if "build" is a required check, a skipped workflow would leave doc-only PRs waiting forever.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A skipped job counts as passing for a required check, so draft PRs are not blocked.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Fetch aria2
        shell: pwsh
        run: ./tools/get-aria2.ps1

      - name: Build
        run: dotnet build Aria2NET.slnx -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test Aria2NET.Tests --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Publishing has its own failure modes (it once left out the compiled XAML), so check it before merging anything that touches
  # packaging. Manual runs only, and only once the build and tests pass.
  package:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Package win-x64
        shell: pwsh
        run: ./tools/package.ps1 -Rid win-x64 -Version 0.0.0-ci
