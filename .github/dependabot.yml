version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # The app ships this runtime inside the zip; 2.6.4 once garbled all text on hybrid-GPU laptops. Update it by hand and run the packaged zip first.
    ignore:
      - dependency-name: "Microsoft.WindowsAppSDK"
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
